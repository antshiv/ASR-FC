name: Flight-control contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Check validation harness failure propagation
        run: scripts/test_validation_harness.sh
      - name: Build and test motor-link contracts
        env:
          ASR_FC_ENABLE_SANITIZERS: ON
        run: scripts/run_validation.sh artifacts/pull-request
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: asr-fc-pull-request-evidence
          path: artifacts/pull-request

  embedded-protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Arm GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: Compile protocol for both MCU families
        run: sh scripts/check_embedded_protocol.sh
